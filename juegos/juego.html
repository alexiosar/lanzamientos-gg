<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>REDIRIGIENDO — LANZAMIENTOS.LAT</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .redir { text-align: center; padding: 4rem 1rem; color: var(--gris-5); letter-spacing: 2px; font-size: 0.8125rem; }
    .redir a { color: var(--acento); }
  </style>
</head>
<body>
  <!--
    Esta página existe solo como puente para links antiguos del tipo
    juegos/juego.html?id=xxx. Las fichas reales son estáticas (juegos/{id}.html),
    generadas por scripts/generar-fichas.py. No debe contener plantillas de
    JavaScript: Googlebot escanea el código en busca de URLs y llegó a rastrear
    literales sin evaluar como si fueran enlaces.
  -->
  <main class="contenedor">
    <p class="redir" id="mensaje">
      REDIRIGIENDO A LA FICHA DEL JUEGO…<br><br>
      <a href="/">◀ VOLVER AL CALENDARIO</a>
    </p>
  </main>

  <script>
    (function () {
      var id = new URLSearchParams(window.location.search).get("id");
      if (id && /^[a-z0-9-]+$/.test(id)) {
        window.location.replace("/juegos/" + id);
      } else {
        window.location.replace("/");
      }
    })();
  </script>
</body>
</html>
